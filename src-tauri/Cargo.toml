[package]
name = "flowshark"
version = "0.1.0"
description = "A fast, native-feeling flowchart application for Windows on ARM and macOS"
authors = ["FlowShark contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowshark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
