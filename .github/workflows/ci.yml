name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit tests, build, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end smoke test
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    # Only build installers for tags, manual runs, and pushes to main
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: FlowShark-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/flowshark.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (universal)
    # Only build installers for tags, manual runs, and pushes to main
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri app (universal binary)
        run: npx tauri build --target universal-apple-darwin
      - name: Compress .app bundle
        # Zip preserves the executable bits and symlinks that upload-artifact
        # would strip from a bare .app directory.
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent FlowShark.app FlowShark-macos-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FlowShark-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/FlowShark-macos-universal.app.zip
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/FlowShark-windows-arm64/bundle/nsis/*.exe
            artifacts/FlowShark-windows-x64/bundle/nsis/*.exe
            artifacts/FlowShark-macos-universal/dmg/*.dmg
            artifacts/FlowShark-macos-universal/macos/FlowShark-macos-universal.app.zip
