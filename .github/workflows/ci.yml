name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts into contents: write.
permissions:
  contents: read

# TODO(supply-chain): pin every third-party action to an immutable commit SHA
# (`uses: owner/action@<sha> # vX.Y.Z`) rather than a mutable tag, and pin
# `cargo-audit` to a specific version. Both need the exact SHAs/versions
# verified against the upstream repositories before they are committed — an
# unverified pin is a hard CI failure, so this is tracked rather than guessed.
# See CODEX-REVIEW-RESPONSE.md ("Release provenance").

jobs:
  test:
    name: Typecheck, unit tests, build, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end smoke test
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore

  audit:
    name: Dependency audit (npm + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust/Tauri dependencies
        # Fails on advisories with a fix available; unmaintained/unsound
        # warnings (the GTK stack, which is Linux-only and never compiled
        # into the Windows builds) are reported but do not fail the job.
        run: cargo audit -f src-tauri/Cargo.lock

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    # Only build installers for tags, manual runs, and pushes to main
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: FlowShark-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/flowshark.exe
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/FlowShark-windows-arm64/bundle/nsis/*.exe
            artifacts/FlowShark-windows-x64/bundle/nsis/*.exe
